name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify HTML File
        run: |
          echo "Checking project files..."
          ls -la
          test -f index.html
          echo "index.html found successfully!"

      - name: Build Static Website
        run: |
          echo "Building static website..."
          mkdir -p build
          cp index.html build/
          echo "Build completed successfully!"

      - name: Display Build Output
        run: |
          echo "Build contents:"
          ls -la build
          echo "CI pipeline completed successfully!"

      - name: Send Success Notification
        if: success()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data '{"text":"✅ CI Pipeline SUCCESS for devops-webapp! Build completed successfully."}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Send Failure Notification
        if: failure()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data '{"text":"❌ CI Pipeline FAILED for devops-webapp. Please check GitHub Actions logs."}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"