<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Web Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            padding: 40px;
            margin: auto;
            width: 70%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .status {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 DevOps Automation Web App</h1>

        <p>
            This website is deployed using an automated CI/CD pipeline.
        </p>

        <p>
            GitHub Actions performs Continuous Integration,
            Slack provides ChatOps notifications,
            and Netlify automatically deploys the application.
        </p>

        <div class="status">
            ● CI/CD Pipeline Active
        </div>
    </div>

</body>

</html>
